<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ApexMart - Full-Stack Modern Amazon Clone E-Commerce Platform. Fast delivery, prime deals, and secure checkout." />
    <meta name="theme-color" content="#131921" />
    <meta property="og:title" content="ApexMart - Prime Marketplace" />
    <meta property="og:description" content="Discover millions of products with fast delivery and verified sellers on ApexMart." />
    <meta property="og:type" content="website" />
    <title>ApexMart - Prime Marketplace</title>

    <!-- Google Fonts: Inter & Outfit (Non-blocking modern loading) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap"
      />
    </noscript>

    <!-- Instant theme sync script to prevent layout shift and forced reflow -->
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('isDarkMode');
          if (mode === 'true' || (mode === null && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-gray-100 text-gray-900 dark:bg-brand-slate dark:text-gray-100 transition-colors duration-200 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
